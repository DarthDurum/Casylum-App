name: Release

# Push a version tag (for example `git tag v0.2.0 && git push origin v0.2.0`),
# or run this workflow from the Actions tab (it tags the version in
# tauri.conf.json on the chosen branch), to build installers for Windows, macOS and Linux and publish them as a
# GitHub Release. The app's built-in updater reads latest.json from the
# newest release, so published releases reach existing installs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: version
        run: |
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v$conf"; fi
          echo "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          v="${tag#v}"
          if [ "$v" != "$conf" ] || [ "$v" != "$pkg" ] || [ "$v" != "$cargo" ]; then
            echo "::error::$tag does not match the app version. Run 'pnpm version:set $v' and commit first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the draft
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release named $TAG already exists. Bump the version with 'pnpm version:set' first."
            exit 1
          fi
          # On a manual run the tag doesn't exist yet; it is created on this commit when the release is published.
          gh release create "$TAG" --draft --generate-notes --title "Casylum $TAG" --target "$GITHUB_SHA"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}
      - run: pnpm install --frozen-lockfile

      # Updates are signed so the app only installs builds made here. When the
      # signing secrets are missing, installers are still built, just without
      # the files the in-app updater needs.
      # Updates are signed so the app only installs builds made here. The
      # public key is in tauri.conf.json; the private key is a repo secret.
      # Without it, installers are still built, just without the files the
      # in-app updater needs.
      - name: Enable signed updates
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$PRIVATE_KEY" ]; then
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              c.bundle.createUpdaterArtifacts = true;
              fs.writeFileSync(p, JSON.stringify(c, null, 2));
            '
            echo "Signed updates enabled."
          else
            echo "::warning::The TAURI_SIGNING_PRIVATE_KEY secret is not set, so this release won't be offered as an in-app update."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
